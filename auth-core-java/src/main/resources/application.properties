# Spring will look for the DB_URL env var; if missing, it defaults to the local string
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aegis_db}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:password}

# Custom Aegis Properties
aegis.security.brain-url=${SECURITY_BRAIN_URL:http://localhost:8000}
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}
auth.cookie.name=${AUTH_COOKIE_NAME:AEGIS_TOKEN}
auth.cookie.secure=${COOKIE_SECURE:false}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Local PostgreSQL usually runs without TLS; set DB_SSLMODE=require for Supabase.
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}

# HikariCP tuning; adjust to your app load
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Avoid verbose SQL logging that may leak data
logging.level.org.hibernate.SQL=warn
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=warn

# Management endpoints: do not expose sensitive actuators publicly
management.endpoints.web.exposure.exclude=env,beans,threaddump,heapdump
management.endpoint.health.show-details=never