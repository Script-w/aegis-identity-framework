
name: Aegis CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-java:
    name: Build & Test Java Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install Native Argon2 Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev

      - name: Grant Execute Permission for Wrapper
        run: chmod +x auth-core-java/mvnw

      - name: Build with Maven
        run: |
          cd auth-core-java
          ./mvnw clean verify
        env:
          # These must match what your application-test.properties or application.properties expects
          DB_URL: jdbc:h2:mem:testdb
          DB_USER: sa
          DB_PASSWORD: ""
          JWT_SECRET: "ci_testing_secret_key_32_characters_long"
          JWT_EXPIRATION: 3600000

  test-security-brain:
    name: Test Security Brain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: python -m pip install -r security-brain-python/requirements.txt

      - name: Run Python Tests
        working-directory: security-brain-python
        run: python -m unittest discover -s . -p 'test_*.py'

  integration-compose:
    name: Docker Compose Authentication Flow
    runs-on: ubuntu-latest
    needs: [build-java, test-security-brain]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Integration Test Dependencies
        run: python -m pip install -r integration-tests/requirements.txt

      - name: Create Test Environment
        run: cp .env.example .env

      - name: Start Compose Stack
        run: docker compose up --build --wait

      - name: Run Authentication Flow
        run: python -m pytest integration-tests -v

      - name: Show Compose Logs on Failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose Stack
        if: always()
        run: docker compose down --volumes --remove-orphans
